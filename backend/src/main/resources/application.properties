# Secrets live in backend/.env (git-ignored). Copy .env.example to .env and fill it in.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:messenger_hub}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

server.port=8279

# Background jobs run on their own threads: the archiver pauses between chats and
# must not block chat-list polling.
spring.task.scheduling.pool.size=4

jwt.secret=${JWT_SECRET}
jwt.expiration=900000
jwt.refresh-expiration=604800000

# AES key for messenger credentials at rest. Generate: openssl rand -base64 32
app.encryption.key=${ENCRYPTION_KEY}

# Defaults suit running the services by hand on the host. Under Docker each is
# overridden with the compose service name, which only resolves inside the network.
telegram.python.service.url=${TELEGRAM_SERVICE_URL:http://localhost:8201}
slack.python.service.url=${SLACK_SERVICE_URL:http://localhost:8202}
discord.python.service.url=${DISCORD_SERVICE_URL:http://localhost:8203}
whatsapp.node.service.url=${WHATSAPP_SERVICE_URL:http://localhost:8204}
viber.python.service.url=${VIBER_SERVICE_URL:http://localhost:8205}

# Background archiving of chat history
archive.backfill.enabled=true
archive.backfill.interval-ms=300000
archive.backfill.initial-delay-ms=60000
archive.backfill.batch-size=10
archive.backfill.min-age-minutes=60
archive.backfill.pause-ms=1000
archive.backfill.messages-per-chat=50

# ── Local model (Ollama) ────────────────────────────────────────────────────
# Analysis runs against a model on this machine. Nothing is sent anywhere else:
# the archive holds private correspondence written by people who never agreed to
# have it forwarded to a third party.
ollama.url=${OLLAMA_URL:http://localhost:11434}
# CPU inference is measured in minutes, not seconds.
ollama.timeout-seconds=600

# ── Semantic search ─────────────────────────────────────────────────────────
# Embeddings are computed locally, like everything else the model does.
# Requires: ollama pull bge-m3
# bge-m3 is multilingual. nomic-embed-text was tried first and ranked football news above
# the one message that matched a Ukrainian query; bge-m3 put that message first in 4 of 5
# test queries on the same archive, at about 25% more indexing time. Vectors are keyed by
# model, so changing this re-indexes on its own.
embeddings.enabled=true
embeddings.model=${EMBEDDINGS_MODEL:bge-m3}
# Indexing is deliberately slow: it competes with analysis for the same CPU.
embeddings.batch-size=32
embeddings.interval-ms=120000
embeddings.initial-delay-ms=120000

# ── Voice transcription (whisper-service) ───────────────────────────────────
# Runs locally on the CPU. Audio is fetched from the messenger, transcribed and
# discarded — only the text is stored.
whisper.url=${WHISPER_URL:http://localhost:8206}
whisper.enabled=true
whisper.language=uk
# Transcription happens when the user presses the button on a voice message, not on a
# timer. A scheduled sweep re-downloads audio through the same Telegram connection the
# open chat needs, and decodes at roughly real time — it made the application slow to
# use in exchange for filling an archive nobody had asked to have filled.
whisper.background=false
# Small batches on a long interval: this competes with analysis for the same cores.
whisper.batch-size=2
whisper.interval-ms=600000
whisper.initial-delay-ms=300000

# ── Background work ─────────────────────────────────────────────────────────
# Archiving, embedding and transcription share one CPU and one connection per
# messenger. They run one at a time, and none of them starts while the user has
# made a request in the last few seconds — a person waiting for a chat to open
# outranks a backlog that has all night.
background.user-quiet-ms=20000
