server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router owns the paths. Without this, a reload on /dashboard asks nginx for a
    # file that was never built and gets a 404 instead of the app.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed filenames make these safe to cache indefinitely; index.html must not be,
    # or a deploy leaves browsers pointing at bundles that no longer exist.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
